name: Cloudflare Pages - prepara frontend QA (senza pubblicare)

on:
  workflow_dispatch:
  push:
    branches:
      - qa/gymtrack-isolato
    paths:
      - 'src/**'
      - 'public/**'
      - 'angular.json'
      - 'ngsw-config.json'
      - 'tools/**'
      - 'package*.json'
      - '.github/workflows/cloudflare-pages-build.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test e build Angular/PWA
        run: npm run quality
      - name: Verifica output statico
        run: |
          test -f dist/gymtrack/browser/index.html
          test -f dist/gymtrack/browser/manifest.webmanifest
          test -f dist/gymtrack/browser/ngsw.json
      - name: Conserva frontend compilato QA
        uses: actions/upload-artifact@v4
        with:
          name: gymtrack-cloudflare-pages-qa-${{ github.sha }}
          path: dist/gymtrack/browser/
          if-no-files-found: error
          retention-days: 7

# Deliberatamente nessun deploy: il backend richiede ancora migrazione
# autenticazione Sites, backup R2 e test multiutente. La produzione resta intatta.
