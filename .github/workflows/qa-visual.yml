name: GymTrack QA visuale isolata (solo test)

on:
  push:
    branches:
      - qa/gymtrack-isolato
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gymtrack-qa-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot:
    if: github.ref == 'refs/heads/qa/gymtrack-isolato'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GYMTRACK_QA_OUTPUT: ${{ runner.temp }}/gymtrack-qa-screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install app dependencies in disposable runner
        run: npm ci
      - name: Verify Angular templates and types
        run: npm run typecheck
      - name: Build actual GymTrack frontend and Worker (NO deploy)
        run: npm run build
      - name: Install disposable Playwright browser
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start isolated in-memory QA server
        run: |
          node tests/runtime/design-studio-qa-server.mjs > "${RUNNER_TEMP}/gymtrack-qa-server.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/gymtrack-qa-server.pid"
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/gymtrack-qa-server.log"
          exit 1
      - name: Capture real GymTrack screenshots with AI SuperAdmin QA
        run: node tests/runtime/qa-screenshots.mjs
      - name: Attach screenshots, synthetic CSV/ICS and QA verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gymtrack-qa-reale-${{ github.sha }}
          path: ${{ env.GYMTRACK_QA_OUTPUT }}
          if-no-files-found: warn
          retention-days: 30
      - name: Stop and destroy in-memory QA server
        if: always()
        run: |
          if test -f "${RUNNER_TEMP}/gymtrack-qa-server.pid"; then
            kill "$(cat "${RUNNER_TEMP}/gymtrack-qa-server.pid")" || true
          fi
