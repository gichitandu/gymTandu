name: Pubblica su Cloudflare
on:
  workflow_dispatch:
    inputs:
      run_quality:
        description: Esegui prima tutte le verifiche (npm run quality)
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      VW_ID_EMAIL: ${{ secrets.VW_ID_EMAIL }}
      VW_ID_PASSWORD: ${{ secrets.VW_ID_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Controlla i segreti
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SETUP_CODE; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then echo "Manca il segreto $name nelle impostazioni del repository."; exit 1; fi
          done
        env:
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
      - run: npm ci
      - name: Verifiche complete
        if: ${{ inputs.run_quality }}
        run: npm run quality
      - name: Build
        if: ${{ !inputs.run_quality }}
        run: npm run build
      - name: Prepara database e bucket
        run: node tools/cloudflare-prepare.mjs
      - name: Applica le migrazioni
        run: npx --yes wrangler@4 d1 migrations apply gymtrack-accounts --remote
      - name: Pubblica il Worker
        run: npx --yes wrangler@4 deploy
      - name: Imposta la chiave per le email di avviso (facoltativa)
        if: ${{ env.RESEND_API_KEY != '' }}
        run: printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4 secret put RESEND_API_KEY
      - name: Imposta l'accesso Volkswagen per GT Garage (facoltativo)
        if: ${{ env.VW_ID_EMAIL != '' && env.VW_ID_PASSWORD != '' }}
        run: |
          printf '%s' "$VW_ID_EMAIL" | npx --yes wrangler@4 secret put VW_ID_EMAIL
          printf '%s' "$VW_ID_PASSWORD" | npx --yes wrangler@4 secret put VW_ID_PASSWORD
      - name: Imposta il codice di setup
        run: printf '%s' "$SETUP_CODE" | npx --yes wrangler@4 secret put SETUP_CODE
        env:
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
