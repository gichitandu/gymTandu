name: Anteprima statica su Pages (senza API)
on:
  workflow_dispatch:
    inputs:
      confirm_static_only:
        description: Pubblica solo il frontend, senza API, account e backup server
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ inputs.confirm_static_only }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/gymtrack/browser
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
